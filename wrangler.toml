name = "chess-com-rating"
main = "build/index.js"
compatibility_date = "2026-06-14"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[observability.logs]
enabled = true

[durable_objects]
bindings = [
  { name = "RUSTY_LIMITER", class_name = "RustyLimiter", script_name = "durable-rusty-limiter"},
]

[[tail_consumers]]
service = "axiom-tail-worker"
